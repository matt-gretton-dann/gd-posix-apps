name: bc Linux CPU profile smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/bc/scripts/profile-bc.py'
      - '.github/workflows/bc-linux-cpu-profile.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install perf
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends linux-tools-generic
      - name: Collect checked CPU samples from the release interpreter
        shell: bash
        run: |
          set -euo pipefail
          perf=$(find -L /usr/lib/linux-tools -name perf -type f | sort -V | tail -n 1)
          test -x "$perf"
          export GD_PERF_EXECUTABLE="$perf"
          # Hosted perf_event_paranoid blocks unprivileged events. Use a
          # privileged recorder, but launch bc as the regular runner user.
          cat > "$RUNNER_TEMP/bc-perf" <<'WRAPPER'
          #!/bin/bash
          set -euo pipefail
          if [[ $1 == script ]]; then
            exec "$GD_PERF_EXECUTABLE" "$@"
          fi
          args=()
          data=
          while [[ $1 != -- ]]; do
            if [[ $1 == -o ]]; then data=$2; fi
            args+=("$1")
            shift
          done
          test -n "$data"
          shift
          sudo -n /usr/bin/env PERF_CONFIG=/dev/null "$GD_PERF_EXECUTABLE" "${args[@]}" -- \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups "$@"
          sudo -n /usr/bin/chown "$(id -u):$(id -g)" "$data"
          WRAPPER
          chmod +x "$RUNNER_TEMP/bc-perf"
          python3 src/bc/scripts/build-gd-bc.py --source "$GITHUB_WORKSPACE" \
            --revision "$(git rev-parse HEAD)" --output profile-build --name gd \
            --split-point 126 --c-compiler gcc --cxx-compiler g++
          python3 src/bc/scripts/bench-bc.py --config profile-build/implementations.json \
            --workload loop_1000000 --samples 3 --warmups 1 --output profile-timing
          python3 src/bc/scripts/profile-bc.py --config profile-build/implementations.json \
            --implementation gd --summary profile-timing/summary.json \
            --replay-corpus profile-timing --workload loop_1000000 --output profile-evidence \
            --perf "$RUNNER_TEMP/bc-perf"
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('profile-evidence')
          manifest = json.loads((root / 'manifest.json').read_text())
          workload, = manifest['workloads']
          assert workload['checked'] and workload['cpu']['checked']
          assert workload['cpu']['event'] == 'cpu-clock:u'
          trace = (root / 'loop_1000000.perf.txt').read_text()
          assert 'cpu-clock:u:' in trace and '/bc)' in trace
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-linux-cpu-profile-${{ github.run_id }}
          path: profile-evidence/
          if-no-files-found: ignore
          retention-days: 30
