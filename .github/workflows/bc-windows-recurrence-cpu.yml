name: bc Windows recurrence CPU diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - '.github/workflows/bc-windows-recurrence-cpu.yml'
      - 'docs/utilities/bc-windows-recurrence-cpu/**'

permissions:
  actions: read
  contents: read

jobs:
  profile:
    if: github.head_ref == 'codex/bc-windows-recurrence-cpu-profile' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record the frozen diagnostic inputs
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess
          root = Path('profile-results')
          root.mkdir()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (root / 'plan.json').write_text(json.dumps(dict(
              workflow_source=source, archive=13891505514, blocks=2, launches_per_stage=64,
              scope='checked CPU samples only'), indent=2) + '\n', encoding='utf-8')
      - name: Retrieve the original archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe -fsSL --retry 2 --max-time 120 -H "Authorization: Bearer $env:GH_TOKEN" "https://api.github.com/repos/matt-gretton-dann/gd-posix-apps/actions/artifacts/13891505514/zip" -o original.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the archive and build the decoder
        shell: pwsh
        run: |
          python docs/utilities/bc-windows-recurrence-cpu/test-collect.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python docs/utilities/bc-windows-recurrence-cpu/collect.py original.zip unused unused --verify-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build docs/utilities/bc-windows-recurrence-cpu/TraceReader.csproj --configuration Release --output decoder
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect checked CPU samples
        shell: pwsh
        run: |
          python docs/utilities/bc-windows-recurrence-cpu/collect.py original.zip decoder/TraceReader.dll profile-results/checked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish the scoped CPU evidence
        if: always()
        uses: ./.github/actions/bc-upload-evidence
        with:
          name: bc-windows-recurrence-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: profile-results/
