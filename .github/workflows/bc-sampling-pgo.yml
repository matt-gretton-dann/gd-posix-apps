name: bc Linux sampling PGO capability

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bc-sampling-pgo.yml']

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install the sampling tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-18 llvm-18 linux-tools-generic
      - name: Record and validate a userspace branch profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          lscpu > evidence/cpu.txt
          cat /proc/sys/kernel/perf_event_paranoid > evidence/perf-event-paranoid.txt
          # Ubuntu's generic kernel tools directory contains symlinks to
          # the versioned package's executables.
          perf=$(find -L /usr/lib/linux-tools -name perf -type f | sort -V | tail -n 1)
          if [[ ! -x $perf ]]; then
            echo 'Could not locate the installed perf executable.' >&2
            exit 1
          fi
          "$perf" --version > evidence/perf-version.txt
          clang-18 --version > evidence/compiler.txt
          cat > evidence/probe.c <<'PROBE'
          #include <stdint.h>
          #include <stdio.h>

          __attribute__((noinline)) uint32_t train(uint32_t state, unsigned iterations)
          {
            for (unsigned i = 0; i < iterations; ++i) {
              if (state & 1)
                state = state * 1664525u + 1013904223u;
              else
                state = (state >> 1) ^ (state * 33u);
            }
            return state;
          }

          int main(int argc, char **argv)
          {
            (void)argv;
            printf("%u\n", train((uint32_t)argc, 300000000));
          }
          PROBE
          clang-18 -O2 -gline-tables-only -fdebug-info-for-profiling \
            evidence/probe.c -o probe
          ./probe > evidence/expected.txt
          record() {
            local name=$1
            shift
            if timeout 30s "$perf" record -o "$name.data" "$@" \
              -- ./probe > "$name-output.txt" 2> "evidence/$name.log"; then
              return
            fi
            # Elevate the collector on this disposable runner. Keep the
            # sampled program unprivileged and leave the kernel policy alone.
            if timeout 30s sudo -n "$perf" record -o "$name-root.data" "$@" \
              -- /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
                --init-groups ./probe > "$name-output.txt" 2> "evidence/$name-root.log"; then
              sudo -n cat "$name-root.data" > "$name.data"
            else
              return 1
            fi
          }
          if record cpu-clock -e cpu-clock:u; then
            cmp evidence/expected.txt cpu-clock-output.txt
            "$perf" script -i cpu-clock.data > evidence/cpu-clock-samples.txt
          fi
          if ! record branches -e cycles:u -b; then
            echo 'Hosted runner could not record userspace branch stacks.' | tee evidence/result.txt
            exit 0
          fi
          cmp evidence/expected.txt branch-output.txt
          llvm-profgen-18 --binary=probe --perfdata=branches.data \
            --output=evidence/probe.prof 2> evidence/profgen.log
          llvm-profdata-18 show --sample --all-functions evidence/probe.prof \
            > evidence/profile.txt
          grep -Eq "Function: train: [1-9][0-9]*," evidence/profile.txt
          clang-18 -O2 -gline-tables-only -fdebug-info-for-profiling \
            -fprofile-sample-use=evidence/probe.prof -Werror=profile-instr-out-of-date \
            evidence/probe.c -o probe-profiled
          ./probe-profiled > profile-output.txt
          cmp evidence/expected.txt profile-output.txt
          echo 'Recorded and consumed a nonempty userspace branch profile.' | tee evidence/result.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-sampling-pgo-capability-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
