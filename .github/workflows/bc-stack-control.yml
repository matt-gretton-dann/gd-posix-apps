name: bc same-image operand stack diagnostic

on:
  push:
    branches: ['codex/bc-207-stack-control']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare both execution modes inside one executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/revision.txt
          c++ --version > evidence/compiler.txt
          lscpu > evidence/cpu.txt
          for role in independent image; do
            option=OFF
            if [[ $role == image ]]; then option=ON; fi
            cmake -S . -B "build-$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DENABLE_NON_POSIX_EXTENSIONS=ON -DENABLE_BC_PREPARED_DIVISORS=OFF \
              "-DENABLE_BC_STACK_EXECUTION=$option" -DBC_MULTIPLY_SPLIT_POINT=126
            cmake --build "build-$role" --target bc --parallel 2
            cp "build-$role/compile_commands.json" "evidence/$role-compile.json"
          done
          for mode in 0 1; do
            GD_BC_STACK_CONTROL_REGISTER="$mode" \
              python3 src/bc/test-vm-cli.py build-image/src/bc/bc --extensions ON
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import sys
          from unittest.mock import patch

          evidence = Path('evidence')
          roles = []
          for name in ('independent', 'registers', 'stack'):
              role = 'independent' if name == 'independent' else 'image'
              binary = Path('build-' + role, 'src/bc/bc').resolve()
              commands = (evidence / (role + '-compile.json')).read_text()
              assert ('GD_BC_STACK_EXECUTION=1' in commands) == (role == 'image')
              roles.append(dict(name=name, argv=[str(binary)], metadata=dict(
                  binary_sha256=hashlib.sha256(binary.read_bytes()).hexdigest(),
                  register_control=name == 'registers')))
          assert roles[1]['metadata']['binary_sha256'] == roles[2]['metadata']['binary_sha256']
          (evidence / 'implementations.json').write_text(json.dumps(dict(implementations=roles)))
          bench = runpy.run_path('src/bc/scripts/bench-bc.py')
          main = bench['main']
          checked = bench['run_checked']

          def run_checked(implementation, case, timeout, program_path=None):
              mode = '1' if implementation['name'] == 'registers' else '0'
              with patch.dict(os.environ, GD_BC_STACK_CONTROL_REGISTER=mode):
                  return checked(implementation, case, timeout, program_path)

          main.__globals__['run_checked'] = run_checked
          for preset in ('full', 'holdout'):
              cases = bench['corpus'](preset, listing=True)
              prefixes = ('loop_', 'calls_', 'recursion_', 'array_', 'sparse_array_',
                          'compare_high_', 'streaming_statements_', 'frontend_definitions_')
              selected = [part for case in cases if case['name'].startswith(prefixes)
                          for part in ('--workload', case['name'])]
              sys.argv = ['bench-bc.py', '--config', str(evidence / 'implementations.json'),
                          '--output', str(evidence / preset), '--preset', preset,
                          '--reference', 'registers', '--seed', '207530', *selected]
              assert main() == 0
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-stack-control-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
