name: bc fixed Windows CPU coverage cohort
on:
  pull_request:
    branches: [main, 'codex/**']
    paths: ['.github/workflows/bc-windows-cpu-cohort.yml']
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Accepted immutable source anchor (empty uses documented anchor)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: bc-windows-cpu-cohort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  paired:
    name: Windows CPU coverage / ${{ matrix.replica }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      BC_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      BC_BASE: ${{ github.event.pull_request.base.sha || inputs.baseline || '21b3638ed338009a7bccf022cddcc119ce620296' }}
      BC_BROAD: 'true'
      BC_CPU_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BC_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Build, check and measure serial paired processes
        shell: pwsh
        run: |
          $arguments = @('src/bc/scripts/benchmark-ci.py', '--source', $env:GITHUB_WORKSPACE, '--base', $env:BC_BASE, '--candidate', $env:BC_CANDIDATE, '--output', 'bc-native-results')
          if ($env:BC_BROAD -eq 'true') { $arguments += '--broad' }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record the fixed cohort identity
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'bc-native-results/evidence' | Out-Null
          $identity = @{replica=$env:BC_CPU_REPLICA; cohort_size=3; base=$env:BC_BASE; candidate=$env:BC_CANDIDATE; target_cpu='AMD EPYC 7763'; policy='Three predetermined jobs; retain every outcome and actual host. No CPU filtering, favorable reruns or pooling.'}
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'bc-native-results/evidence/cpu-cohort.json'), ($identity | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
      - name: Preserve raw checked samples and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bc-windows-cpu-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-native-results/evidence/
          if-no-files-found: error
          retention-days: 30
