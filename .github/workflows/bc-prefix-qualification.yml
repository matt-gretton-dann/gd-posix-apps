name: bc result prefix native qualification

on:
  pull_request:
    branches: [main]
    paths: ['src/bc/**', '.github/workflows/bc-prefix-qualification.yml']

permissions:
  contents: read

concurrency:
  group: bc-prefix-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    # One declared cohort, after the correctness/resource preflight. Keep
    # failures and inconclusive rows; a green job is not adoption approval.
    if: github.head_ref == 'codex/bc-657-prefix-qualification'
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, macos-15, windows-2025]
        comparison: [default-off, prefix-on]
        suite: [arithmetic, math-full, math-holdout]
    name: Prefix / ${{ matrix.image }} / ${{ matrix.comparison }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 360
    env:
      BC_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      BC_BASE: ${{ matrix.comparison == 'prefix-on' && github.event.pull_request.head.sha || '92fb2c62c9293c5bc10a953776ab148733e1587a' }}
      BC_PREFIX: ${{ matrix.comparison == 'prefix-on' }}
      BC_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BC_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record declared comparison
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cohort | Out-Null
          git rev-parse HEAD | Out-File cohort/source.txt -Encoding utf8
          '${{ matrix.comparison }} ${{ matrix.suite }} base=${{ env.BC_BASE }} prefix=${{ env.BC_PREFIX }}' | Out-File cohort/comparison.txt -Encoding utf8
          Copy-Item docs/utilities/bc-prefix-qualification.md cohort/protocol.md
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Collect fixed full and held-out elapsed and resource evidence
        shell: pwsh
        run: |
          if ($env:BC_SUITE -eq 'arithmetic') {
            $arguments = @('src/bc/scripts/benchmark-ci.py', '--source', $env:GITHUB_WORKSPACE, '--base', $env:BC_BASE, '--candidate', $env:BC_CANDIDATE, '--output', 'prefix-results', '--broad', '--sparse-qualification', '--compare-resources')
          } else {
            $preset = $env:BC_SUITE.Substring(5)
            $arguments = @('src/bc/scripts/benchmark-math-ci.py', '--source', $env:GITHUB_WORKSPACE, '--base', $env:BC_BASE, '--candidate', $env:BC_CANDIDATE, '--output', 'prefix-results', '--broad', '--broad-preset', $preset, '--compare-resources', '--duration-seconds', '.25', '--child-timeout-seconds', '600', '--total-seconds', '18000')
          }
          if ($env:BC_PREFIX -eq 'true') { $arguments += '--candidate-prefix-results' }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bind startup roles to the exact arithmetic executables
        if: matrix.suite == 'arithmetic'
        shell: python
        run: |
          import json
          from pathlib import Path
          roles = [json.loads(Path('prefix-results', role, 'implementations.json').read_text())['implementations'][0] for role in ('base', 'aa', 'candidate')]
          Path('cohort/startup-config.json').write_text(json.dumps(dict(implementations=roles), indent=2) + '\n')
      - name: Collect candidate-specific startup study after ordinary timing
        if: matrix.suite == 'arithmetic'
        shell: pwsh
        run: |
          python src/bc/scripts/startup-calibration.py --config cohort/startup-config.json --output cohort/startup --total-seconds 2400 --child-timeout-seconds 5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve every outcome, exact binary and recipe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bc-prefix-qualification-${{ matrix.image }}-${{ matrix.comparison }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cohort/
            prefix-results/evidence/
          if-no-files-found: error
          retention-days: 30
