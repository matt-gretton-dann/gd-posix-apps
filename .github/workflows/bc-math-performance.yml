name: bc native mathematical comparisons
on:
  pull_request:
    branches: [main, 'codex/**']
    paths: ['src/**', 'libgdsup/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/bc-math-performance.yml']
  push:
    branches: [main, 'codex/bc-math-broad/**']
    paths: ['src/**', 'libgdsup/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/bc-math-performance.yml']
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:
    inputs:
      base:
        description: Immutable mathematical baseline checkpoint
        required: false
        default: '78a732a6c1f995b45b140d4b86d8d3af57354804'
permissions:
  contents: read
concurrency:
  group: bc-math-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  paired:
    # Dedicated preflight and qualification topics do not start ordinary timing.
    if: github.head_ref != 'codex/bc-652-competitive-margin' && github.head_ref != 'codex/bc-655-array-profile' && github.head_ref != 'codex/bc-659-startup-calibration' && github.head_ref != 'codex/bc-663-versioned-roles' && github.head_ref != 'codex/bc-666-portable-scalar'
    name: Native math bc / ${{ matrix.image }}${{ matrix.preset == 'holdout' && ' / holdout' || '' }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, windows-2025, macos-15]
        # Each broad preset gets the existing per-job bounds and same-job pairs.
        preset: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/heads/codex/bc-math-broad/') || startsWith(github.head_ref, 'codex/bc-math-broad/') || github.head_ref == 'codex/bc-217-current-integration') || startsWith(github.head_ref, 'codex/bc-native-prepared/')) && '["full","holdout"]' || '["full"]') }}
    env:
      BC_BASE: ${{ github.event.pull_request.base.sha || inputs.base || '78a732a6c1f995b45b140d4b86d8d3af57354804' }}
      BC_PRESET: ${{ matrix.preset }}
      BC_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      BC_BROAD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/bc-native-prepared/') || (startsWith(github.ref, 'refs/heads/codex/bc-math-broad/') || startsWith(github.head_ref, 'codex/bc-math-broad/') || github.head_ref == 'codex/bc-217-current-integration') }}
      # Opt in only this experimental topic; controls retain their source defaults.
      BC_PREPARED: ${{ startsWith(github.head_ref, 'codex/bc-native-prepared/') }}
      BC_PREPARSED_LIBRARY: ${{ github.head_ref == 'codex/bc-217-preparsed-library' || github.head_ref == 'codex/bc-217-defer-library-functions' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BC_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Build independent controls and measure checked native math roles
        shell: pwsh
        run: |
          $arguments = @('src/bc/scripts/benchmark-math-ci.py', '--source', $env:GITHUB_WORKSPACE, '--candidate', $env:BC_CANDIDATE, '--base', $env:BC_BASE, '--total-seconds', '6600', '--output', 'bc-math-results')
          if ($env:BC_BROAD -eq 'true') { $arguments += @('--broad', '--broad-preset', $env:BC_PRESET) }
          if ($env:BC_PREPARED -eq 'true') { $arguments += '--candidate-prepared-divisors' }
          if ($env:BC_PREPARSED_LIBRARY -eq 'true') { $arguments += '--candidate-preparsed-library' }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve raw checked samples and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bc-math-native-${{ matrix.image }}${{ matrix.preset == 'holdout' && '-holdout' || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-math-results/evidence/
          if-no-files-found: error
          retention-days: 30
