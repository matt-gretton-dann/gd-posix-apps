name: GD-Posix-Apps Build/test CI
on:
  push:
    branches: [ main ]
  pull_request:
    # Topic bases allow normal checks for stacked pull requests.
    branches: [ main, 'codex/**' ]

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  posix-build:
    name: Build and test on ${{ matrix.check_os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        extensions: [OFF, ON]
        include:
          # Retain the established check names while pinning the Linux image.
          - os: ubuntu-24.04
            check_os: ubuntu-latest
          - os: macos-latest
            check_os: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Replay retained native control evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-native-controls-and-kernels/verify.py
      - name: Reject corrupted retained timing evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-native-controls-and-kernels/test-verifiers.py
      - name: Replay native divisor checkpoints
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-divisor-native-evidence/verify.py
      - name: Reject corrupted native divisor checkpoints
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-divisor-native-evidence/test-verifier.py
      - name: Replay retained VM native experiments
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-vm-native-evidence/verify.py
      - name: Reject corrupted VM native experiment evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-vm-native-evidence/test-verifier.py

      - name: Replay retained runtime native experiments
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-runtime-native-evidence/verify.py
      - name: Reject corrupted runtime native evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-runtime-native-evidence/test-verifier.py

      - name: Replay separate divisor coverage collections
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-divisor-mcdc-evidence/verify.py
      - name: Reject corrupted divisor coverage evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-divisor-mcdc-evidence/test-verifier.py

      - name: Verify archived bc evidence bytes
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/verify-bc-evidence-checkout.py
      - name: Replay retained VM reuse cost evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-vm-reuse-evidence/verify.py
      - name: Reject corrupted VM reuse cost evidence
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/bc-vm-reuse-evidence/test-verifier.py
      - name: Check build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Use the runner's tools before contacting the package mirrors.
          have_build_tools() {
            for tool in cc c++ cmake ctest ninja clang-format clang-tidy; do
              command -v "$tool" >/dev/null || return 1
            done
            [[ -x /usr/bin/clang && -x /usr/bin/clang++ ]]
          }
          profile_tool() {
            # Prefer llvm-profdata from the same LLVM installation as Clang.
            local tool
            tool="$(dirname "$(readlink -f /usr/bin/clang)")/llvm-profdata"
            if [[ -x "$tool" ]]; then
              printf '%s\n' "$tool"
            elif [[ -x /usr/bin/llvm-profdata ]]; then
              printf '%s\n' /usr/bin/llvm-profdata
            else
              return 1
            fi
          }
          if ! have_build_tools || ! profdata=$(profile_tool); then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends build-essential cmake clang clang-format ninja-build clang-tidy llvm
            have_build_tools
            profdata=$(profile_tool)
          fi
          printf 'BC_CI_LLVM_PROFDATA=%s\n' "$profdata" >> "$GITHUB_ENV"
      - name: Package install (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install ninja
      - name: Configure
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build"
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
      - name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config Release
      - name: Test
        run: |
          cd "${GITHUB_WORKSPACE}/build"
          ctest -V
      - name: Check bc VM profile round trip
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          if [ "${RUNNER_OS}" = macOS ]; then
            profdata=$(xcrun --find llvm-profdata)
          else
            profdata="${BC_CI_LLVM_PROFDATA}"
          fi
          profile_dir="${RUNNER_TEMP}/bc-vm-pgo"
          mkdir -p "${profile_dir}/raw"
          cmake -S . -B "${profile_dir}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBC_MULTIPLY_SPLIT_POINT=126 \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DENABLE_NON_POSIX_EXTENSIONS=ON -DENABLE_BC_VM_PGO_GENERATE=ON
          cmake --build "${profile_dir}/build" --target bc --parallel 2
          bc="${profile_dir}/build/src/bc/bc"
          LLVM_PROFILE_FILE="${profile_dir}/raw/%p.profraw" \
            python3 src/bc/test-cli.py "${bc}" --extensions ON
          "${profdata}" merge "${profile_dir}"/raw/*.profraw -o "${profile_dir}/vm.profdata"
          cmake -S . -B "${profile_dir}/build" \
            -DENABLE_BC_VM_PGO_GENERATE=OFF -DBC_VM_PGO_PROFILE="${profile_dir}/vm.profdata"
          cmake --build "${profile_dir}/build" --target bc --parallel 2
          python3 src/bc/test-cli.py "${bc}" --extensions ON
      - name: Check pinned comparator recipes
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          python3 src/bc/scripts/build-bc-comparators.py --output build-comparators --implementation both --cc cc
          python3 src/bc/scripts/bench-bc.py --config build-comparators/implementations.json --output build-comparator-checks --preset quick --samples 1 --warmups 0 --require-provenance
          python3 src/bc/scripts/build-gd-bc.py --source "${GITHUB_WORKSPACE}" --revision "$(git rev-parse HEAD)" --split-point 126 --output build-gd-recipe --c-compiler cc --cxx-compiler c++
          python3 src/bc/scripts/bench-bc.py --config build-gd-recipe/implementations.json --output build-gd-recipe-checks --preset quick --samples 1 --warmups 0 --require-provenance
      - name: Check bc profiling and preparsed math
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-profile" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_BC_PROFILE=ON -DENABLE_BC_PREPARED_DIVISORS=ON -DENABLE_BC_PREPARSED_LIBRARY=ON -DBC_MULTIPLY_SPLIT_POINT=126
          cmake --build "${GITHUB_WORKSPACE}/build-profile" --target bc
          ctest --test-dir "${GITHUB_WORKSPACE}/build-profile" --no-tests=error -R "^bc/(divisor-reuse.*|math-library-(image|cli))$" --output-on-failure
          python3 "${GITHUB_WORKSPACE}/src/bc/test-profiling-cli.py" "${GITHUB_WORKSPACE}/build-profile/src/bc/bc" --split-point 126


  windows-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix. os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        extensions: [0, 1]

    steps:
    - uses: actions/checkout@v7
    - name: Replay retained native control evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-native-controls-and-kernels/verify.py
    - name: Reject corrupted retained timing evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-native-controls-and-kernels/test-verifiers.py
    - name: Replay native divisor checkpoints
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-divisor-native-evidence/verify.py
    - name: Reject corrupted native divisor checkpoints
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-divisor-native-evidence/test-verifier.py
    - name: Replay retained VM native experiments
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-vm-native-evidence/verify.py
    - name: Reject corrupted VM native experiment evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-vm-native-evidence/test-verifier.py

    - name: Replay retained runtime native experiments
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-runtime-native-evidence/verify.py
    - name: Reject corrupted runtime native evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-runtime-native-evidence/test-verifier.py

    - name: Replay separate divisor coverage collections
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-divisor-mcdc-evidence/verify.py
    - name: Reject corrupted divisor coverage evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-divisor-mcdc-evidence/test-verifier.py

    - name: Verify archived bc evidence bytes
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/verify-bc-evidence-checkout.py
    - name: Replay retained VM reuse cost evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-vm-reuse-evidence/verify.py
    - name: Reject corrupted VM reuse cost evidence
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/bc-vm-reuse-evidence/test-verifier.py

    - name: Configure
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE\\build" -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
    - name: Build
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release
    - name: Test
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release  --target RUN_TESTS


    - name: Check pinned native Howard recipe
      if: ${{ matrix.extensions == 1 }}
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        if errorlevel 1 exit /b 1
        python src/bc/scripts/build-bc-comparators.py --output build-comparators --cc cl
        if errorlevel 1 exit /b 1
        python src/bc/scripts/bench-bc.py --config build-comparators/implementations.json --output build-comparator-checks --preset quick --samples 1 --warmups 0 --require-provenance
        if errorlevel 1 exit /b 1
        for /f %%i in ('git rev-parse HEAD') do set GD_BENCH_REV=%%i
        python src/bc/scripts/build-gd-bc.py --source "%GITHUB_WORKSPACE%" --revision %GD_BENCH_REV% --split-point 126 --output build-gd-recipe --c-compiler cl --cxx-compiler cl
        if errorlevel 1 exit /b 1
        python src/bc/scripts/bench-bc.py --config build-gd-recipe/implementations.json --output build-gd-recipe-checks --preset quick --samples 1 --warmups 0 --require-provenance
    - name: Check bc profiling and preparsed math
      if: ${{ matrix.extensions == 1 }}
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE/build-profile" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_BC_PROFILE=ON -DENABLE_BC_PREPARED_DIVISORS=ON -DENABLE_BC_PREPARSED_LIBRARY=ON -DBC_MULTIPLY_SPLIT_POINT=126
        cmake --build "$Env:GITHUB_WORKSPACE/build-profile" --config Release --target bc
        ctest --test-dir "$Env:GITHUB_WORKSPACE/build-profile" -C Release --no-tests=error -R "^bc/(divisor-reuse.*|math-library-(image|cli))$" --output-on-failure
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python "$Env:GITHUB_WORKSPACE/src/bc/test-profiling-cli.py" "$Env:GITHUB_WORKSPACE/build-profile/src/bc/Release/bc.exe" --split-point 126
