name: GD-Posix-Apps Build/test CI
on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  posix-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        extensions: [OFF, ON]

    steps:
      - uses: actions/checkout@v7
      - name: Package install (Ubuntu)
        if: ${{ matrix.os  == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt --yes -u dist-upgrade
          sudo apt --yes install build-essential cmake clang-format ninja-build clang-tidy
      - name: Package install (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install ninja
      - name: Configure
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build"
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
      - name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config Release
      - name: Test
        run: |
          cd "${GITHUB_WORKSPACE}/build"
          ctest -V
      - name: Check pinned comparator recipes
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          python3 src/bc/scripts/build-bc-comparators.py --output build-comparators --implementation both --cc cc
          python3 src/bc/scripts/bench-bc.py --config build-comparators/implementations.json --output build-comparator-checks --preset quick --samples 1 --warmups 0 --require-provenance


  windows-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix. os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        extensions: [0, 1]

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE\\build" -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
    - name: Build
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release
    - name: Test
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release  --target RUN_TESTS


    - name: Check pinned native Howard recipe
      if: ${{ matrix.extensions == 1 }}
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        if errorlevel 1 exit /b 1
        python src/bc/scripts/build-bc-comparators.py --output build-comparators --cc cl
        if errorlevel 1 exit /b 1
        python src/bc/scripts/bench-bc.py --config build-comparators/implementations.json --output build-comparator-checks --preset quick --samples 1 --warmups 0 --require-provenance
