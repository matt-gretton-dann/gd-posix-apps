name: GD-Posix-Apps Build/test CI
on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  posix-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        extensions: [OFF, ON]

    steps:
      - uses: actions/checkout@v7
      - name: Package install (Ubuntu)
        if: ${{ matrix.os  == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt --yes -u dist-upgrade
          sudo apt --yes install build-essential cmake clang-format ninja-build clang-tidy
      - name: Package install (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install ninja
      - name: Configure
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build"
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
      - name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config Release
      - name: Test
        run: |
          cd "${GITHUB_WORKSPACE}/build"
          ctest -V
      - name: Check separate bc profiling build
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-profile" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_BC_PROFILE=ON
          cmake --build "${GITHUB_WORKSPACE}/build-profile" --target bc
          python3 "${GITHUB_WORKSPACE}/src/bc/test-profiling-cli.py" "${GITHUB_WORKSPACE}/build-profile/src/bc/bc"


  windows-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix. os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        extensions: [0, 1]

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE\\build" -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
    - name: Build
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release
    - name: Test
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release  --target RUN_TESTS


    - name: Check separate bc profiling build
      if: ${{ matrix.extensions == 1 }}
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE/build-profile" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_BC_PROFILE=ON
        cmake --build "$Env:GITHUB_WORKSPACE/build-profile" --config Release --target bc
        python "$Env:GITHUB_WORKSPACE/src/bc/test-profiling-cli.py" "$Env:GITHUB_WORKSPACE/build-profile/src/bc/Release/bc.exe"
