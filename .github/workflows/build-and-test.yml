name: GD-Posix-Apps Build/test CI
on:
  push:
    branches: [ main ]
  pull_request:
    # Topic bases allow normal checks for stacked pull requests.
    branches: [ main, 'codex/**' ]

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  posix-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        extensions: [OFF, ON]

    steps:
      - uses: actions/checkout@v7
      - name: Verify archived bc evidence bytes
        if: ${{ matrix.extensions == 'ON' }}
        run: python3 docs/utilities/verify-bc-evidence-checkout.py
      - name: Package install (Ubuntu)
        if: ${{ matrix.os  == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt --yes -u dist-upgrade
          sudo apt --yes install build-essential cmake clang-format ninja-build clang-tidy
      - name: Package install (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install ninja
      - name: Configure
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build"
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
      - name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config Release
      - name: Test
        run: |
          cd "${GITHUB_WORKSPACE}/build"
          ctest -V
      - name: Check pinned comparator recipes
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          python3 src/bc/scripts/build-bc-comparators.py --output build-comparators --implementation both --cc cc
          python3 src/bc/scripts/bench-bc.py --config build-comparators/implementations.json --output build-comparator-checks --preset quick --samples 1 --warmups 0 --require-provenance
          python3 src/bc/scripts/build-gd-bc.py --source "${GITHUB_WORKSPACE}" --revision "$(git rev-parse HEAD)" --split-point 126 --output build-gd-recipe --c-compiler cc --cxx-compiler c++
          python3 src/bc/scripts/bench-bc.py --config build-gd-recipe/implementations.json --output build-gd-recipe-checks --preset quick --samples 1 --warmups 0 --require-provenance
      - name: Check separate bc profiling build
        if: ${{ matrix.extensions == 'ON' }}
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-profile" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_BC_PROFILE=ON -DBC_MULTIPLY_SPLIT_POINT=126
          cmake --build "${GITHUB_WORKSPACE}/build-profile" --target bc
          python3 "${GITHUB_WORKSPACE}/src/bc/test-profiling-cli.py" "${GITHUB_WORKSPACE}/build-profile/src/bc/bc" --split-point 126


  windows-build:
    name: Build and test on ${{ matrix.os }} - extensions enabled - ${{matrix.extensions}}
    runs-on: ${{ matrix. os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        extensions: [0, 1]

    steps:
    - uses: actions/checkout@v7
    - name: Verify archived bc evidence bytes
      if: ${{ matrix.extensions == 1 }}
      run: python docs/utilities/verify-bc-evidence-checkout.py
    - name: Configure
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE\\build" -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_NON_POSIX_EXTENSIONS:BOOL=${{matrix.extensions}}
    - name: Build
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release
    - name: Test
      run: cmake --build "$Env:GITHUB_WORKSPACE\\build" --config Release  --target RUN_TESTS


    - name: Check pinned native Howard recipe
      if: ${{ matrix.extensions == 1 }}
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        if errorlevel 1 exit /b 1
        python src/bc/scripts/build-bc-comparators.py --output build-comparators --cc cl
        if errorlevel 1 exit /b 1
        python src/bc/scripts/bench-bc.py --config build-comparators/implementations.json --output build-comparator-checks --preset quick --samples 1 --warmups 0 --require-provenance
        if errorlevel 1 exit /b 1
        for /f %%i in ('git rev-parse HEAD') do set GD_BENCH_REV=%%i
        python src/bc/scripts/build-gd-bc.py --source "%GITHUB_WORKSPACE%" --revision %GD_BENCH_REV% --split-point 126 --output build-gd-recipe --c-compiler cl --cxx-compiler cl
        if errorlevel 1 exit /b 1
        python src/bc/scripts/bench-bc.py --config build-gd-recipe/implementations.json --output build-gd-recipe-checks --preset quick --samples 1 --warmups 0 --require-provenance
    - name: Check separate bc profiling build
      if: ${{ matrix.extensions == 1 }}
      run: |
        cmake -S "$Env:GITHUB_WORKSPACE" -B "$Env:GITHUB_WORKSPACE/build-profile" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_BC_PROFILE=ON -DBC_MULTIPLY_SPLIT_POINT=126
        cmake --build "$Env:GITHUB_WORKSPACE/build-profile" --config Release --target bc
        python "$Env:GITHUB_WORKSPACE/src/bc/test-profiling-cli.py" "$Env:GITHUB_WORKSPACE/build-profile/src/bc/Release/bc.exe" --split-point 126
