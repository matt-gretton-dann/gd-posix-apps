name: bc private scalar correctness experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/bc/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/bc-private-scalars.yml'
  push:
    branches: [main]
    paths:
      - 'src/bc/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/bc-private-scalars.yml'

permissions:
  contents: read

jobs:
  correctness:
    name: Private scalars / ${{ matrix.os }} / ${{ matrix.mode.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        mode:
          - {name: ordinary, typed: 'OFF', profile: 'OFF', extensions: 'ON'}
          - {name: typed, typed: 'ON', profile: 'OFF', extensions: 'OFF'}
          - {name: profile, typed: 'ON', profile: 'ON', extensions: 'ON'}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Build and check enabled private scalar storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/revision.txt
          python_cmd=python3
          executable_suffix=
          if [[ $RUNNER_OS == Windows ]]; then
            export CC=cl CXX=cl
            python_cmd=python
            executable_suffix=.exe
          fi
          cmake -S . -B build-private -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DENABLE_BC_PRIVATE_SCALARS=ON \
            -DENABLE_BC_TYPED_RESULTS=${{ matrix.mode.typed }} \
            -DENABLE_BC_PROFILE=${{ matrix.mode.profile }} \
            -DENABLE_NON_POSIX_EXTENSIONS=${{ matrix.mode.extensions }} \
            -DRUN_CLANG_FORMAT=OFF -DRUN_CLANG_TIDY=OFF -DBC_MULTIPLY_SPLIT_POINT=126 \
            2>&1 | tee evidence/configure.log
          cmake --build build-private --target test-libbc bc test-bc-signal --parallel 2 \
            2>&1 | tee evidence/build.log
          build-private/src/bc/test-libbc${executable_suffix} '[bc][vm],[private-scalars]' \
            2>&1 | tee evidence/vm-tests.log
          ctest --test-dir build-private --no-tests=error --output-on-failure \
            -R '^bc/(vm-lifetime(-ipo)?|signal-(normal|exception)|math-library-(cli|source|image|decisions)|math-imported|math-oracle)$' \
            2>&1 | tee evidence/ctest.log
          "$python_cmd" src/bc/test-cli.py "build-private/src/bc/bc${executable_suffix}" \
            --extensions ${{ matrix.mode.extensions }} 2>&1 | tee evidence/cli.log
          "$python_cmd" src/bc/test-vm-cli.py "build-private/src/bc/bc${executable_suffix}" \
            --extensions ${{ matrix.mode.extensions }} 2>&1 | tee evidence/vm-cli.log
      - name: Preserve configuration and correctness logs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for path in build-private/CMakeCache.txt build-private/compile_commands.json; do
            if [[ -f $path ]]; then cp "$path" evidence/; fi
          done
          if [[ -d build-private/Testing ]]; then cp -R build-private/Testing evidence/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-private-scalars-${{ matrix.os }}-${{ matrix.mode.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
