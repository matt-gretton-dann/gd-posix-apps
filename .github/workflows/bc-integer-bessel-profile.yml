name: bc integer tier Bessel attribution
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bc-integer-bessel-profile.yml'
      - 'docs/utilities/bc-integer-bessel-profile/**'
permissions:
  contents: read
concurrency:
  group: bc-integer-bessel-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  collector-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 docs/utilities/bc-integer-bessel-profile/test-collect.py --scripts src/bc/scripts
      - run: python3 src/bc/test-profiling-tools.py src/bc/scripts/profile-bc.py
  native:
    # One declared diagnostic cohort; no fresh paired timing or calibration.
    if: github.head_ref == 'codex/bc-624-bessel-profile'
    needs: collector-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Make the immutable runtime and its builders available locally
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 2aba8ec2cc1ed23a3806079d2f6dc1caa6cfc27d
          # A reachable ref lets the checked builders clone the exact source.
          git update-ref refs/heads/bc-diagnostic-frozen 2aba8ec2cc1ed23a3806079d2f6dc1caa6cfc27d
          mkdir pinned-tools
          git archive 2aba8ec2cc1ed23a3806079d2f6dc1caa6cfc27d src/bc/scripts | tar -x -C pinned-tools
      - name: Install the existing userspace CPU sampling adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends linux-tools-generic
      - name: Collect checked OFF and ON CPU and software profiles
        shell: bash
        run: |
          set -euo pipefail
          perf=$(find -L /usr/lib/linux-tools -name perf -type f | sort -V | tail -n 1)
          test -x "$perf"
          export GD_PERF_EXECUTABLE="$perf"
          # Match the accepted Linux adapter: only perf is privileged. The
          # interpreter runs as the ordinary runner, without kernel changes.
          cat > "$RUNNER_TEMP/bc-perf" <<'WRAPPER'
          #!/bin/bash
          set -euo pipefail
          if [[ $1 == script ]]; then
            exec "$GD_PERF_EXECUTABLE" "$@"
          fi
          args=()
          data=
          while [[ $1 != -- ]]; do
            if [[ $1 == -o ]]; then data=$2; fi
            args+=("$1")
            shift
          done
          test -n "$data"
          shift
          sudo -n /usr/bin/env PERF_CONFIG=/dev/null "$GD_PERF_EXECUTABLE" "${args[@]}" -- \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups "$@"
          sudo -n /usr/bin/chown "$(id -u):$(id -g)" "$data"
          WRAPPER
          chmod +x "$RUNNER_TEMP/bc-perf"
          python3 docs/utilities/bc-integer-bessel-profile/collect.py \
            --source "$GITHUB_WORKSPACE" --scripts pinned-tools/src/bc/scripts \
            --output integer-bessel-profile --perf "$RUNNER_TEMP/bc-perf"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-integer-bessel-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: integer-bessel-profile/evidence/
          if-no-files-found: ignore
          retention-days: 30
