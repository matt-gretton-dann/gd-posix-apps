name: bc integer tier native qualification
on:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'src/bc/**'
      - '.github/workflows/bc-integer-performance.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: Full immutable source SHA with integer tier support
        required: true
permissions:
  contents: read
concurrency:
  group: bc-integer-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    # This fixed topic starts qualification without needing a dispatch API.
    # Ordinary PRs retain the fast semantic workflow; manual replay stays available.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/bc-598-hybrid-integers' || startsWith(github.head_ref, 'codex/bc-607-')
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, macos-15, windows-2025]
        # Isolate the state-layout hypothesis with arithmetic first. A separate
        # immutable qualification topic or manual replay still runs all suites.
        suite: ${{ fromJSON(github.head_ref == 'codex/bc-607-integer-state' && '["arithmetic"]' || '["arithmetic","math-full","math-holdout"]') }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 360
    env:
      BC_REVISION: ${{ github.event.pull_request.head.sha || inputs.revision }}
      BC_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BC_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Compare independently built OFF and ON modes at the same source
        shell: pwsh
        run: |
          if ($env:BC_SUITE -eq 'arithmetic') {
            python src/bc/scripts/benchmark-ci.py --source $env:GITHUB_WORKSPACE --base $env:BC_REVISION --candidate $env:BC_REVISION --output bc-integer-results --broad --sparse-qualification --candidate-integer-functions
          } else {
            $preset = $env:BC_SUITE.Substring(5)
            python src/bc/scripts/benchmark-math-ci.py --source $env:GITHUB_WORKSPACE --base $env:BC_REVISION --candidate $env:BC_REVISION --output bc-integer-results --broad --broad-preset $preset --candidate-integer-functions --duration-seconds .25 --child-timeout-seconds 600 --total-seconds 18000
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve every checked outcome and build policy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bc-integer-${{ matrix.image }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-integer-results/evidence/
          if-no-files-found: error
          retention-days: 30
