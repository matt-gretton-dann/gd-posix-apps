name: bc portable scalar VM contracts
on:
  pull_request:
    branches: [main, 'codex/**']
    # Protocol publication refreshes correctness at its exact frozen head.
    paths: ['src/bc/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/bc-portable-scalar-contracts.yml', '.github/workflows/bc-portable-scalar-qualification.yml', 'docs/utilities/bc-portable-scalar-qualification.md']
permissions:
  contents: read
concurrency:
  group: bc-portable-scalar-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    if: github.head_ref == 'codex/bc-666-isolated-backend'
    name: contracts (${{ matrix.os }}, typed=${{ matrix.mode.typed }}, profile=${{ matrix.mode.profile }}, extensions=${{ matrix.extensions }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        extensions: ['OFF', 'ON']
        mode:
          - {typed: 'OFF', profile: 'OFF'}
          - {typed: 'ON', profile: 'OFF'}
          - {typed: 'OFF', profile: 'ON'}
          - {typed: 'ON', profile: 'ON'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record immutable source and requested modes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Out-File evidence/revision.txt -Encoding utf8
          'phase=integrated typed=${{ matrix.mode.typed }} profile=${{ matrix.mode.profile }} extensions=${{ matrix.extensions }}' | Out-File evidence/mode.txt -Encoding utf8
      - name: Configure portable VM and ordinary contracts
        run: >-
          cmake -S . -B build-scalar -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DENABLE_NON_POSIX_EXTENSIONS=${{ matrix.extensions }}
          -DENABLE_BC_PORTABLE_SCALAR=ON -DENABLE_BC_NATIVE_SCALAR=OFF
          -DENABLE_BC_TYPED_RESULTS=${{ matrix.mode.typed }}
          -DENABLE_BC_PROFILE=${{ matrix.mode.profile }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build exact VM, ownership and signal contracts
        run: cmake --build build-scalar --config Release --target test-libbc test-bc-signal test-bc-offsets bc --parallel 2
      - name: Bind production backend compilation to the immutable source
        shell: python
        run: |
          import hashlib
          import importlib.util
          import json
          import shutil
          from pathlib import Path
          build = Path('build-scalar')
          path = Path('src/bc/scripts/build-gd-bc.py')
          spec = importlib.util.spec_from_file_location('gd_builder', str(path))
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          binding = builder.verified_portable_scalar(builder.helpers(), build, 'ON')
          assert binding['boundary']['kind'] == 'opaque-object'
          assert binding['boundary']['ipo'] is False
          report = binding['verification']['boundary_report']['path']
          shutil.copyfile(str(build / report), 'evidence/portable-scalar-boundary-Release.txt')
          binding['scope'] = 'Opaque portable transaction; Apple emitter disabled; no elapsed qualification'
          binding['sources'] = {name: hashlib.sha256(Path('src/bc', name).read_bytes()).hexdigest() for name in ('portable-scalar.hh', 'portable-scalar.cc', 'portable-scalar-vm.hh', 'portable-scalar-vm.cc', 'test-portable-scalar.cc', 'test-portable-scalar-vm.cc', 'test-portable-scalar-transaction.cc', 'vm.cc', 'profiling.hh', 'profiling.cc')}
          Path('evidence/component-binding.json').write_text(json.dumps(binding, indent=2) + '\n')
      - name: Run complete unit semantics including portable scalar contracts
        shell: pwsh
        run: |
          $unit = './build-scalar/src/bc/test-libbc'
          if ($IsWindows) { $unit = './build-scalar/src/bc/Release/test-libbc.exe' }
          & $unit --rng-seed 197199 2>&1 | Tee-Object evidence/unit.log
          if ($LASTEXITCODE -ne 0) { throw "Unit contracts failed with $LASTEXITCODE" }
      - name: Check allocation recovery, CLI, interrupts and offset verification
        run: >-
          ctest --test-dir build-scalar -C Release --output-on-failure --no-tests=error
          -R "^bc/(profiling-allocator|profiling-disabled|consumer-mode|vm-lifetime|vm-lifetime-ipo|portable-scalar-allocation-fallback|signal-normal|signal-delivery|verifier-offsets|vm-cli|gd-build-provenance|resource-comparison|portable-scalar-workflow)$"
      - name: Preserve exact mode and every outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bc-portable-scalar-${{ matrix.os }}-typed-${{ matrix.mode.typed }}-profile-${{ matrix.mode.profile }}-extensions-${{ matrix.extensions }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build-scalar/CMakeCache.txt
            build-scalar/compile_commands.json
            build-scalar/src/bc/*.vcxproj
            build-scalar/src/bc/portable-scalar-boundary-*.txt
            build-scalar/gd-ipo-policy.json
            build-scalar/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 30
