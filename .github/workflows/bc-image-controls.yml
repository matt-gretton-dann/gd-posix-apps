name: bc fixed Windows deployment controls
on:
  pull_request:
    branches: [main, 'codex/**']
    paths: ['.github/workflows/bc-image-controls.yml', 'src/bc/scripts/windows-image-probe.py', 'src/bc/scripts/benchmark-image-controls.py', 'src/bc/test-windows-image-probe.py', 'src/bc/test-image-controls.py']
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Accepted immutable 40-digit source SHA (empty uses documented anchor)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: bc-image-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  controls:
    name: Windows deployment controls / ${{ matrix.replica }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      BC_BASE: ${{ github.event.pull_request.base.sha || inputs.baseline || 'd1de5150e511fcc75d718a3fb8d5f680219bafff' }}
      BC_IMAGE_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Establish native MSVC environment
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Measure the complete predetermined diagnostic
        shell: pwsh
        run: |
          python src/bc/scripts/benchmark-image-controls.py --source $env:GITHUB_WORKSPACE --base $env:BC_BASE --output bc-image-results
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve every image, probe and checked sample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bc-image-controls-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-image-results/evidence/
          if-no-files-found: warn
