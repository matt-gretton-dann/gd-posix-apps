name: bc fixed-layout result planner control

on:
  push:
    branches: ['codex/bc-207-fixed-layout-control']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bc-result-plan-control.yml'
      - 'src/bc/function-result-plan.cc'
      - 'src/bc/vm.cc'

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'codex/bc-207-block-local-results' || github.ref == 'refs/heads/codex/bc-207-fixed-layout-control'
    name: Fixed-layout result planner / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BC_BASE: ${{ github.event.pull_request.base.sha || 'c3641876d384c3a708bbf6c67ebedb1b13319c8d' }}
      BC_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BC_CANDIDATE }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BC_BASE }}
          path: base
          persist-credentials: false
      - name: Compare fixed-layout and independent baseline binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          for role in base candidate; do
            options=()
            if [[ $role == candidate ]]; then
              options+=(-DCMAKE_CXX_FLAGS=-DGD_BC_RESULT_PLAN_CONTROL=1)
            fi
            cmake -S "$role" -B "build-$role" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DBC_MULTIPLY_SPLIT_POINT=126 "${options[@]}"
            cmake --build "build-$role" --target bc --parallel 2
            git -C "$role" rev-parse HEAD > "evidence/$role-revision.txt"
            cp "build-$role/compile_commands.json" "evidence/$role-compile.json"
            sha256sum "build-$role/src/bc/bc" >> evidence/binaries.txt
          done
          python3 candidate/src/bc/test-cli.py build-candidate/src/bc/bc --extensions ON
          GD_BC_USE_CHAIN_RESULT_PLAN=1 python3 candidate/src/bc/test-cli.py \
            build-candidate/src/bc/bc --extensions ON
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = str(Path('build-base/src/bc/bc').resolve())
          candidate = str(Path('build-candidate/src/bc/bc').resolve())
          roles = [
              ('base', ['/usr/bin/env', '-u', 'GD_BC_USE_CHAIN_RESULT_PLAN', base]),
              ('same-image-chain', ['/usr/bin/env', 'GD_BC_USE_CHAIN_RESULT_PLAN=1', candidate]),
              ('same-image-block', ['/usr/bin/env', '-u', 'GD_BC_USE_CHAIN_RESULT_PLAN', candidate]),
          ]
          for suite in ('arithmetic', 'math'):
              entries = [{'name': name, 'argv': argv + (['-l'] if suite == 'math' else [])}
                         for name, argv in roles]
              Path('evidence', suite + '.json').write_text(json.dumps({'implementations': entries}))
          PY
          for preset in full holdout; do
            for suite in arithmetic math; do
              output="evidence/$suite-$preset"
              options=()
              if [[ $suite == math ]]; then
                options+=(--calibrate-seconds 0.1)
              fi
              python3 candidate/src/bc/scripts/bench-bc.py --config "evidence/$suite.json" \
                --output "$output" --preset "$preset" --suite "$suite" --reference base \
                --samples 11 --warmups 1 --seed 197505 "${options[@]}"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-result-plan-control-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
