name: bc cached native function correctness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/bc/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/bc-native-function-correctness.yml'
  push:
    branches: [main]
    paths:
      - 'src/bc/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/bc-native-function-correctness.yml'

permissions:
  contents: read

jobs:
  correctness:
    name: Native functions / ${{ matrix.os }} / ${{ matrix.mode.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        mode:
          - {name: ordinary, typed: 'OFF', profile: 'OFF', extensions: 'ON'}
          - {name: profile, typed: 'ON', profile: 'ON', extensions: 'OFF'}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Build and check native function execution and fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/revision.txt
          python_cmd=python3
          executable_suffix=
          if [[ $RUNNER_OS == Windows ]]; then
            export CC=cl CXX=cl
            python_cmd=python
            executable_suffix=.exe
          fi
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DENABLE_BC_NATIVE_SCALAR=OFF -DENABLE_BC_NATIVE_FUNCTIONS=ON \
            -DENABLE_BC_TYPED_RESULTS=${{ matrix.mode.typed }} \
            -DENABLE_BC_PROFILE=${{ matrix.mode.profile }} \
            -DENABLE_NON_POSIX_EXTENSIONS=${{ matrix.mode.extensions }} \
            -DRUN_CLANG_FORMAT=OFF -DRUN_CLANG_TIDY=OFF -DBC_MULTIPLY_SPLIT_POINT=126 \
            2>&1 | tee evidence/configure.log
          cmake --build build-native --target test-libbc bc test-bc-signal --parallel 2 \
            2>&1 | tee evidence/build.log
          "$python_cmd" - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          database=Path('build-native/compile_commands.json')
          rows=json.loads(database.read_text())
          vm=[r for r in rows if r['file'].replace(chr(92),'/').endswith('/src/bc/vm.cc')]
          assert len(vm)==1
          command=vm[0].get('command') or ' '.join(vm[0]['arguments'])
          import os
          names={r['file'].replace(chr(92),'/').split('/')[-1] for r in rows}
          expected=os.environ['RUNNER_OS']!='macOS'
          selected='GD_BC_NATIVE_FUNCTIONS=1' in command
          assert selected==expected
          assert ('native-expression-x64.cc' in names)==expected
          Path('evidence/native-build.json').write_text(json.dumps(dict(
              native_functions_selected=selected,expected_native_functions=expected,
              backend='native-expression-x64.cc' if selected else 'generic fallback',
              compile_commands_sha256=hashlib.sha256(database.read_bytes()).hexdigest(),
              scope='Compiled selection; positive-entry profiling tests follow on x64; macOS arm64 retains generic execution; no timing acceptance'),indent=2)+'\n')
          PYCODE
          if [[ $RUNNER_OS != macOS ]]; then
            build-native/src/bc/test-libbc${executable_suffix} '[native-expression]' \
              2>&1 | tee evidence/native-tests.log
            grep -q 'All tests passed' evidence/native-tests.log
          fi
          build-native/src/bc/test-libbc${executable_suffix} '[bc][vm]' \
            2>&1 | tee evidence/vm-tests.log
          ctest --test-dir build-native --no-tests=error --output-on-failure \
            -R '^bc/(vm-lifetime(-ipo)?|signal-(normal|exception)|math-library-(cli|source|image|decisions)|math-imported|math-oracle)$' \
            2>&1 | tee evidence/ctest.log
          "$python_cmd" src/bc/test-cli.py "build-native/src/bc/bc${executable_suffix}" \
            --extensions ${{ matrix.mode.extensions }} 2>&1 | tee evidence/cli.log
          "$python_cmd" src/bc/test-vm-cli.py "build-native/src/bc/bc${executable_suffix}" \
            --extensions ${{ matrix.mode.extensions }} 2>&1 | tee evidence/vm-cli.log
      - name: Preserve configuration and correctness logs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for path in build-native/CMakeCache.txt build-native/compile_commands.json; do
            if [[ -f $path ]]; then cp "$path" evidence/; fi
          done
          if [[ -d build-native/Testing ]]; then cp -R build-native/Testing evidence/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-native-function-correctness-${{ matrix.os }}-${{ matrix.mode.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
