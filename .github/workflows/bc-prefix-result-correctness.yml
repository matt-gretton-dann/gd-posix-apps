name: bc prefix result lifetime correctness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/bc/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/bc-prefix-result-correctness.yml'

permissions:
  contents: read

jobs:
  correctness:
    if: github.head_ref == 'codex/bc-prefix-clear-results' || github.head_ref == 'codex/bc-frame-math-integration'
    name: Prefix results / ${{ matrix.os }} / ${{ matrix.mode.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        mode:
          - {name: ordinary, prefix: 'ON', typed: 'OFF', compact: 'ON', native: 'OFF', profile: 'OFF', extensions: 'ON'}
          - {name: fallback, prefix: 'OFF', typed: 'ON', compact: 'ON', native: 'OFF', profile: 'ON', extensions: 'ON'}
          - {name: generic, prefix: 'ON', typed: 'OFF', compact: 'ON', native: 'OFF', profile: 'ON', extensions: 'OFF'}
          - {name: typed, prefix: 'ON', typed: 'ON', compact: 'ON', native: 'OFF', profile: 'ON', extensions: 'OFF'}
          - {name: wide, prefix: 'ON', typed: 'OFF', compact: 'OFF', native: 'OFF', profile: 'ON', extensions: 'ON'}
          - {name: coexist, prefix: 'ON', typed: 'ON', compact: 'ON', native: 'ON', profile: 'OFF', extensions: 'ON'}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Establish native MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Native x64 MSVC is unavailable' }
          $variables = & cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE) { throw 'Cannot initialize MSVC' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|Platform)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Build and check prefix cleanup, ownership and fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/revision.txt
          python_cmd=python3
          executable_suffix=
          if [[ $RUNNER_OS == Windows ]]; then
            export CC=cl CXX=cl
            python_cmd=python
            executable_suffix=.exe
          fi
          cmake -S . -B build-prefix -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DENABLE_BC_NATIVE_SCALAR=OFF -DENABLE_BC_NATIVE_FUNCTIONS=${{ matrix.mode.native }} \
            -DENABLE_BC_PREFIX_CLEAR_RESULTS=${{ matrix.mode.prefix }} \
            -DENABLE_BC_COMPACT_EXECUTION=${{ matrix.mode.compact }} \
            -DENABLE_BC_TYPED_RESULTS=${{ matrix.mode.typed }} \
            -DENABLE_BC_PROFILE=${{ matrix.mode.profile }} \
            -DENABLE_NON_POSIX_EXTENSIONS=${{ matrix.mode.extensions }} \
            -DRUN_CLANG_FORMAT=OFF -DRUN_CLANG_TIDY=OFF -DBC_MULTIPLY_SPLIT_POINT=126 \
            2>&1 | tee evidence/configure.log
          cmake --build build-prefix --target test-libbc bc test-bc-signal --parallel 2 \
            2>&1 | tee evidence/build.log
          "$python_cmd" - <<'PYCODE'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('evidence');build=Path('build-prefix')
          database=build/'compile_commands.json';raw=database.read_bytes();rows=json.loads(raw)
          vm=[r for r in rows if r['file'].replace(chr(92),'/').endswith('/src/bc/vm.cc')]
          assert len(vm)==1
          command=vm[0].get('command') or ' '.join(vm[0]['arguments'])
          expected=dict(prefix='${{ matrix.mode.prefix }}',typed='${{ matrix.mode.typed }}',compact='${{ matrix.mode.compact }}',profile='${{ matrix.mode.profile }}',native='${{ matrix.mode.native }}')
          for key,define in [('prefix','GD_BC_PREFIX_CLEAR_RESULTS'),('typed','GD_BC_TYPED_RESULTS'),('compact','GD_BC_COMPACT_EXECUTION')]:
              assert define+'='+str(int(expected[key]=='ON')) in command
          for key,define in [('profile','GD_BC_PROFILE=1'),('native','GD_BC_NATIVE_FUNCTIONS=1')]:
              assert (define in command)==(expected[key]=='ON')
          inputs=['src/bc/vm.cc','src/bc/prefix-result-buffer.hh','src/bc/profiling.hh','src/bc/profiling.cc','src/bc/test-vm-execution.cc','src/bc/test-prefix-result-buffer.cc','src/bc/CMakeLists.txt','src/bc/math-library.bc','src/bc/test-math-library-cli.py','src/bc/test-math-library-coverage.py','src/bc/fixtures/math-library-decisions.json']
          source={}
          for name in inputs:
              p=Path(name);q=root/'source'/name;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q);source[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          objects=[p for p in build.rglob('*') if p.is_file() and p.name in ('vm.cc.o','vm.cc.obj') and 'libbc.dir' in p.parts]
          assert len(objects)==1
          obj=objects[0];shutil.copy2(obj,root/obj.name)
          binaries={}
          for name in ['bc','test-libbc','test-bc-signal','test-bc-vm-lifetime','test-bc-vm-lifetime-ipo']:
              for suffix in ('','.exe'):
                  p=build/'src/bc'/(name+suffix)
                  if p.is_file():
                      q=root/'images'/p.name;q.parent.mkdir(exist_ok=True);shutil.copy2(p,q);binaries[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(binaries)>=4
          (root/'prefix-build.json').write_text(json.dumps(dict(expected=expected,compile_commands_sha256=hashlib.sha256(raw).hexdigest(),source=source,vm_object=dict(path=str(obj),sha256=hashlib.sha256(obj.read_bytes()).hexdigest()),binaries=binaries,scope='Actual compiled modes, changed source inputs, object and correctness images only; no elapsed acceptance'),indent=2)+'\n')
          PYCODE
          if [[ '${{ matrix.mode.native }}' == ON ]]; then
            build-prefix/src/bc/test-libbc${executable_suffix} '[native-expression]' \
              2>&1 | tee evidence/native-tests.log
            grep -q 'All tests passed' evidence/native-tests.log
          fi
          build-prefix/src/bc/test-libbc${executable_suffix} '[bc][vm]' \
            2>&1 | tee evidence/vm-tests.log
          if [[ '${{ matrix.mode.profile }}' == ON ]]; then
            build-prefix/src/bc/test-libbc${executable_suffix} '[bc][vm][execution][prefix-results-profile]' -s \
              2>&1 | tee evidence/prefix-work.log
          fi
          # Include CLI recovery around calls as well as the VM signal guards.
          # Unsupported PTY hosts retain the fixture's explicit skip.
          ctest --test-dir build-prefix --no-tests=error --output-on-failure \
            -R '^bc/(vm-lifetime(-ipo)?|signal-(normal|exception|delivery)|math-library-(cli|source|image|decisions)|math-imported|math-oracle|profiling-(allocator|disabled|cli)|consumer-mode)$' \
            2>&1 | tee evidence/ctest.log
          "$python_cmd" src/bc/test-cli.py "build-prefix/src/bc/bc${executable_suffix}" \
            --extensions ${{ matrix.mode.extensions }} 2>&1 | tee evidence/cli.log
          "$python_cmd" src/bc/test-vm-cli.py "build-prefix/src/bc/bc${executable_suffix}" \
            --extensions ${{ matrix.mode.extensions }} 2>&1 | tee evidence/vm-cli.log
      - name: Preserve configuration and correctness logs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for path in build-prefix/CMakeCache.txt build-prefix/compile_commands.json; do
            if [[ -f $path ]]; then cp "$path" evidence/; fi
          done
          if [[ -d build-prefix/Testing ]]; then cp -R build-prefix/Testing evidence/; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc-prefix-result-correctness-${{ matrix.os }}-${{ matrix.mode.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
